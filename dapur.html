    const nip=(lapOp.nip||'').trim();
    return arr.filter(e=>{
      const ev=(e[f]||'').trim().toLowerCase();
      const enip=(e[f+'_nip']||e['operator_nip']||e['petugas_nip']||'').trim();
      return ev===nm||ev===un||(nip&&enip&&enip===nip);

  const allPhotos=[...logs.flatMap(l=>safePhotos(l.photos)),...alatLogs.flatMap(l=>safePhotos(l.photos))].filter(p=>(p.url&&p.url.trim()!=='')||(p.thumb&&p.thumb.trim()!=='')||(p.d&&p.d.trim()!=='')||(p.viewUrl&&p.viewUrl.trim()!==''));

    ${logs.length===0?'<div class="es"><p>Belum ada checklist dapur bulan ini</p></div>':`

      ${logs.map((e,i)=>{

      ${alatLogs.map((e,i)=>{

      ${sanLogs.map((e,i)=>{
        const aspekDetails=sanNamesOf(e).map((asp,ai)=>({nama:asp,status:(e.san&&e.san[ai])||'ok'}));

          <td><span class="bdg ${e.kondisi==='Baik'?'b-ok':'b-w'}">${e.kondisi||'–'}</span></td>
          <td style="font-size:11px">${e.catatan||'–'}</td>
        </tr>`;}).join('')}
    </tbody></table></div>`}
  </div>

  <!-- SECTION IV: REGISTER ALAT RUSAK -->
  <div style="margin-bottom:20px">
    <h4 style="font-family:'Lora',serif;color:var(--p);border-left:4px solid var(--a);padding-left:10px;margin-bottom:10px">IV. REGISTER ALAT RUSAK / TIDAK LAYAK (${regRusakAll.length} Temuan)</h4>

</div>`;}

function rLapBulIKI4(){

      </div>
      <div class="fg"><label class="fl">Jenis Kecacatan</label><input class="fc" id="nm-cacat" value="${d.cacat||''}" placeholder="cth: Tuna Daksa – Cacat Kaki"></div>
      <div class="fg2">
        <div class="fg"><label class="fl">Agama</label><select class="fc" id="nm-agama"><option value="Islam" ${d.agama==='Islam'?'selected':''}>Islam</option><option value="Kristen" ${d.agama==='Kristen'?'selected':''}>Kristen</option><option value="Katolik" ${d.agama==='Katolik'?'selected':''}>Katolik</option><option value="Hindu" ${d.agama==='Hindu'?'selected':''}>Hindu</option><option value="Buddha" ${d.agama==='Buddha'?'selected':''}>Buddha</option></select></div>
        <div class="fg"><label class="fl">Status BPJS</label><select class="fc" id="nm-bpjs"><option value="Aktif" ${d.bpjs==='Aktif'?'selected':''}>Aktif</option><option value="Tidak" ${d.bpjs==='Tidak'?'selected':''}>Tidak</option><option value="-" ${d.bpjs==='-'?'selected':''}>–</option></select></div>
      </div>
    </div>
    <div class="mf">
      <button class="btn btn-o" id="nom-cancel-btn">Batal</button>
      <button class="btn btn-p" id="nom-save-btn">💾 Simpan</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector('#nom-close-btn').onclick=close;
  ov.querySelector('#nom-cancel-btn').onclick=close;
  ov.addEventListener('click',e=>{if(e.target===ov)close();});
  ov.querySelector('#nom-save-btn').onclick=async()=>{
    const nama=document.getElementById('nm-nama').value.trim();
    if(!nama){showAlert('Nama wajib diisi!','er');return;}
    const payload={
      n:    parseInt(document.getElementById('nm-n').value)||d.n,
      reg:  document.getElementById('nm-reg').value.trim(),
      nama, ttl:  document.getElementById('nm-ttl').value.trim(),
      usia: parseInt(document.getElementById('nm-usia').value)||0,
      jk:   document.getElementById('nm-jk').value,
      pend: document.getElementById('nm-pend').value,
      kab:  document.getElementById('nm-kab').value.trim(),
      alat: document.getElementById('nm-alat').value,
      cacat:document.getElementById('nm-cacat').value.trim(),
      agama:document.getElementById('nm-agama').value,
      bpjs: document.getElementById('nm-bpjs').value,
    };
    const btn=ov.querySelector('#nom-save-btn');
    btn.disabled=true; btn.textContent='⏳ Menyimpan...';
    try{
      if(GAS_URL){
        const res=await gasSavePost('saveNominatif',{pm:payload,updatedBy:S.user.name,_nip:S.user.nip,token:API_TOKEN});
        if(!res||!res.success){showAlert('Gagal menyimpan: '+(res?.error||'unknown'),'er');btn.disabled=false;btn.textContent='💾 Simpan';return;}
      }
      // Update local NOM array
      const idx=NOM.findIndex(x=>x.n===payload.n);
      if(idx>=0) NOM[idx]=payload; else NOM.push(payload);
      NOM.sort((a,b)=>a.n-b.n);
      close();
      setState({nomSearch:S.nomSearch});
      showAlert('✅ Data PM berhasil disimpan','ok');
    }catch(e){showAlert('Error: '+e.message,'er');btn.disabled=false;btn.textContent='💾 Simpan';}
  };
}

async function doDelNom(n, nama){
  const ok2=await confirmDialog(`Hapus data PM No.${n} – ${nama}?\nTindakan ini tidak dapat dibatalkan.`);
  if(!ok2)return;
  try{
    if(GAS_URL){
      const res=await gasSavePost('deleteNominatif',{n,_nip:S.user.nip,token:API_TOKEN});
      if(!res||!res.success){showAlert('Gagal hapus: '+(res?.error||'unknown'),'er');return;}
    }
    const idx=NOM.findIndex(x=>x.n===n);
    if(idx>=0) NOM.splice(idx,1);
    setState({nomSearch:S.nomSearch});
    showAlert('✅ Data PM berhasil dihapus','ok');
  }catch(e){showAlert('Error: '+e.message,'er');}
}

// ================================================================
// PRE-FETCH FOTO SEBELUM PRINT
// Solusi baru: TIDAK pakai popup/blob window baru.
// Print dilakukan via overlay di window yang SAMA sehingga
// cookie Google tetap aktif → foto Drive langsung tampil.
// preloadPhotosForPrint hanya menyiapkan _printSrc (Drive URL),
// tanpa konversi canvas-to-base64 yang rawan CORS.
// ================================================================
async function preloadPhotosForPrint(photoArr) {
  const results = [];
  for (const p of photoArr) {
    // BUG FIX: Gunakan getPhotoSrc() yang mengecek semua sumber termasuk localStorage cache
    // Ini mengatasi foto kosong di PDF setelah reload/sync GAS (GAS tidak menyimpan base64)
    const cachedSrc = getPhotoSrc(p);
    // Prioritas 1: thumb/d lokal base64 (sudah dihandle oleh getPhotoSrc)
    if (cachedSrc && cachedSrc.startsWith('data:')) { results.push({...p, _printSrc: cachedSrc}); continue; }
    // Prioritas 2: Drive thumbnail URL (cookie aktif di overlay window yang sama)
    const driveUrl = p.url ? driveThumbUrl(p.url) : (p.viewUrl ? driveThumbUrl(p.viewUrl) : '');
    // Gunakan cachedSrc (Drive URL dari getPhotoSrc) atau driveUrl sebagai fallback
    results.push({...p, _printSrc: cachedSrc || driveUrl || ''});
  }
  return results;
}

// ================================================================
// PRINT FUNCTIONS – Overlay di window yang sama (cookie aktif)
// ================================================================
function printPage(title, bodyHTML) {
  openPrintOverlay(title, bodyHTML);
}

function openPrintOverlay(title, bodyHTML) {
  // Hapus overlay lama jika ada
  const old = document.getElementById('print-overlay-root');
  if (old) old.remove();

  // Buat container overlay
  const overlay = document.createElement('div');
  overlay.id = 'print-overlay-root';
  overlay.style.cssText = [
    'position:fixed','inset:0','background:#fff','z-index:99999',
    'overflow-y:auto','padding:0','margin:0'
  ].join(';');

  // Tombol tutup (tidak muncul saat print)
  const closeBtn = document.createElement('button');
  closeBtn.id = 'print-overlay-close';
  closeBtn.textContent = '✕ Tutup';
  closeBtn.style.cssText = [
    'position:fixed','top:12px','right:16px','z-index:100000',
    'background:#6B1A1A','color:#fff','border:none','border-radius:8px',
    'padding:8px 16px','font-size:13px','cursor:pointer','font-family:sans-serif',
    'box-shadow:0 2px 8px rgba(0,0,0,0.3)'
  ].join(';');
  closeBtn.onclick = () => {
    overlay.remove();
    document.title = window._prevTitle || document.title;
  };

  // Tombol cetak
  const printBtn = document.createElement('button');
  printBtn.id = 'print-overlay-print';
  printBtn.textContent = '🖨️ Cetak / Simpan PDF';
  printBtn.style.cssText = [
    'position:fixed','top:12px','right:140px','z-index:100000',
    'background:#C9962A','color:#3A0A0A','border:none','border-radius:8px',
    'padding:8px 16px','font-size:13px','cursor:pointer','font-weight:700',
    'font-family:sans-serif','box-shadow:0 2px 8px rgba(0,0,0,0.2)'
  ].join(';');
  printBtn.onclick = () => window.print();

  // Konten cetak dengan CSS
  const content = document.createElement('div');
  content.id = 'print-overlay-content';
  content.innerHTML = `<style>${PRINT_CSS_STR}
    /* Tambahan: dalam overlay semua elemen lain disembunyikan saat print */
    @media print {
      #print-overlay-close, #print-overlay-print { display:none!important; }
    }
  </style>${cleanUndef(/^(Laporan IKI|Berita Acara IKI)/.test(title)?markWideTables(bodyHTML):wrapWideTables(bodyHTML))}`;

  overlay.appendChild(closeBtn);
  overlay.appendChild(printBtn);
  overlay.appendChild(content);
  document.body.appendChild(overlay);

  // Simpan judul asli, ganti sementara agar nama file PDF sesuai
  window._prevTitle = document.title;
  document.title = title;

  // Tunggu semua gambar siap sebelum menawarkan print
  const imgs = Array.from(overlay.querySelectorAll('img'));
  if (imgs.length === 0) return;
  let loaded = 0;
  const checkDone = () => { loaded++; /* tidak auto-print, user klik sendiri */ };
  imgs.forEach(img => {
    if (img.complete) { loaded++; return; }
    img.onload = checkDone;
    img.onerror = checkDone;
  });

  // Restore judul setelah print dialog tutup
  window.addEventListener('afterprint', function onAP() {
    document.title = window._prevTitle || document.title;
    window.removeEventListener('afterprint', onAP);
  });
}

// Halaman landscape hanya untuk tabel yang lebar (>= 9 kolom); sisanya tetap portrait
// Laporan IKI: SELALU portrait. Tabel lebar diperkecil hurufnya, teks dibungkus (tidak dipotong).
function markWideTables(html){
  const root=document.createElement('div');root.innerHTML=html;
  root.querySelectorAll('table').forEach(t=>{
    let max=0;
    t.querySelectorAll('tr').forEach(r=>{let n=0;Array.from(r.children).forEach(c=>{if(c.tagName==='TH'||c.tagName==='TD')n+=parseInt(c.getAttribute('colspan')||1)||1;});if(n>max)max=n;});
    if(max>=14)t.classList.add('wide-p2');else if(max>=9)t.classList.add('wide-p');
  });
  return root.innerHTML;
}
function wrapWideTables(html){
  const root=document.createElement('div');root.innerHTML=html;
  root.querySelectorAll('table').forEach(t=>{
    if(t.closest('.land')||t.closest('.bl-fitbox'))return;
    let max=0;
    t.querySelectorAll('tr').forEach(r=>{let n=0;Array.from(r.children).forEach(c=>{if(c.tagName==='TH'||c.tagName==='TD')n+=parseInt(c.getAttribute('colspan')||1)||1;});if(n>max)max=n;});
    if(max<9)return;
    let tgt=t;
    while(tgt.parentElement&&tgt.parentElement!==root&&tgt.parentElement.children.length===1&&!tgt.parentElement.classList.contains('page'))tgt=tgt.parentElement;
    const w=document.createElement('div');w.className='land';
    tgt.parentNode.insertBefore(w,tgt);
    const prev=w.previousElementSibling;
    if(prev&&/^H[1-4]$/.test(prev.tagName))w.appendChild(prev);
    w.appendChild(tgt);
  });
  return root.innerHTML;
}

async function doPrintIKI1(){
  showSyncIndicator(true,'⏳ Memuat foto untuk cetak...');
  try {
  const lapOp=S.lapAsOp||(S.user.role==='operator'?S.user:null);
  const filterOp=(arr,f)=>{
    if(!lapOp) return arr;
    const nm=(lapOp.name||'').trim().toLowerCase();
    const un=(lapOp.un||'').trim().toLowerCase();
    const nip=(lapOp.nip||'').trim();
    return arr.filter(e=>{
      const ev=(e[f]||'').trim().toLowerCase();
      const enip=(e[f+'_nip']||e['operator_nip']||e['petugas_nip']||'').trim();
      return ev===nm||ev===un||(nip&&enip&&enip===nip);
    });
  };
  const logs=filterOp(byMonth(S.i1,S.selMonth),'operator');
  const op=lapOp||getOp12(); const k=getKasi();
  const isAdminKasi=!lapOp&&(S.user.role==='admin'||S.user.role==='kasi');
  const allOps=S.users.filter(u=>u.role==='operator');
  const uniqDays=[...new Set(logs.map(l=>l.tgl))].sort();
  let allPhotos=logs.flatMap(l=>safePhotos(l.photos).map(p=>({...p, url:p.url||'', thumb:p.thumb||p.d||'', label:p.label||p.l||'', l:`${fmtDate(l.tgl)} – ${l.sesi||l.petugas||''} | ${p.label||p.l||''}`})));

function getBelanja(periode) {
  if(!S.i1_belanja||!S.i1_belanja.length) S.i1_belanja=[makeBelanjaPeriode(1),makeBelanjaPeriode(2),makeBelanjaPeriode(3)];
  // FIX: gunakan == (bukan ===) agar aman meski periode string vs number
  // Selalu ambil/pastikan data untuk bulan aktif (S.selMonth) – JANGAN pernah fallback ke
  // periode milik bulan lain, karena itu menyebabkan data Pembelian 10 Hari antar bulan
  // tampak saling terhubung/tertukar.
  let bel=S.i1_belanja.find(b=>b.periode==periode && b.bulan===S.selMonth);
  if(!bel){
    bel=S.i1_belanja.find(b=>b.periode==periode && !b.bulan);
    if(bel) bel.bulan=S.selMonth; // data lama tanpa bulan → anggap milik bulan aktif
  }
  if(!bel){
    bel=makeBelanjaPeriode(periode,S.selMonth);
    S.i1_belanja=[...S.i1_belanja,bel];
  }
  return bel;
}

function updateBelanjaTgl(periode, jenis, val) {
  const bel=getBelanja(periode);
  if(!bel)return;
  if(jenis==='kering') bel.tgl_kering=val;
  S.i1_belanja=[...S.i1_belanja];
  // No full re-render needed (input already has value)
}

function updateBasahTgl(periode, pgId, val) {
  const bel=getBelanja(periode);
  if(!bel)return;
  const pg=bel.pengiriman_basah.find(p=>p.id===pgId);
  if(pg) pg.tgl=val;
  S.i1_belanja=[...S.i1_belanja];
}

function updateBahanItem(periode, tableId, itemId, field, val) {
  const bel=getBelanja(periode);
  if(!bel)return;
  let item;
  if(tableId==='kering'){
    item=bel.bahan_kering.find(x=>x.id===itemId);
  } else {
    const pgId=tableId.replace('basah_','');
    const pg=bel.pengiriman_basah.find(p=>p.id===pgId);
    if(pg) item=pg.items.find(x=>x.id===itemId);
  }
  if(item) item[field]=val;
  S.i1_belanja=[...S.i1_belanja];
  S._belanjaSaveAllowed = true;
  saveSession(); // FIX: simpan ke sessionStorage segera setiap edit
  queueSaveBelanja(); // auto-save ke GAS setelah 3 detik
}

function addBahanItem(periode, jenis) {
  const bel=getBelanja(periode);
  if(!bel)return;
  const newItem={id:'k'+periode+'_c'+Date.now(),nama:'',jml:'',sat:'',sudah:'',belum:'',ket:''};
  if(jenis==='kering'){
    bel.bahan_kering=[...bel.bahan_kering,newItem];
    // Append row langsung ke tabel tanpa re-render penuh
    const tbody=document.querySelector('#kering tbody');
    if(tbody){
      const i=bel.bahan_kering.length-1;
      const tr=document.createElement('tr');
      tr.innerHTML=`<td style="text-align:center">${i+1}</td>
        <td><input type="text" class="fc" style="padding:4px 6px" value="" onchange="updateBahanItem(${periode},'kering','${newItem.id}','nama',this.value)"></td>
        <td><input type="text" class="fc" style="padding:4px 6px;text-align:center" value="" onchange="updateBahanItem(${periode},'kering','${newItem.id}','jml',this.value)"></td>

    setState({i1_belanja:[...S.i1_belanja]});
  }

function delBahanItem(periode, tableId, itemId) {
  const bel=getBelanja(periode);

}

async function delPengirimanBasah(periode, pgId) {
  if(!await confirmDialog('Hapus pengiriman ini?'))return;
  const bel=getBelanja(periode);
  if(!bel)return;
  bel.pengiriman_basah=bel.pengiriman_basah.filter(p=>p.id!==pgId);
  S._belanjaSaveAllowed = true; // user confirm hapus → izinkan save
  setState({i1_belanja:[...S.i1_belanja]});
}

async function resetBelanjaPeriode(periode) {
  if(!await confirmDialog('Reset pembelian '+periode+' ke data default? Data yang diisi akan hilang.'))return;
  const newPer=makeBelanjaPeriode(periode);
  newPer.bulan=S.selMonth;
  // Cari entry dengan periode dan bulan yang sama
  const idx=S.i1_belanja.findIndex(b=>b.periode===periode&&(b.bulan===S.selMonth||!b.bulan));
  if(idx>=0) S.i1_belanja[idx]=newPer;
  else S.i1_belanja.push(newPer);
  setState({i1_belanja:[...S.i1_belanja]});
}

// Reset semua periode (I + II + III) ke template default
async function resetAllBelanja() {
  if(!await confirmDialog('Reset SEMUA pembelian (I, II, III) ke template default? Semua data yang sudah diisi akan hilang.'))return;
  const newAll=[1,2,3].map(p=>{const b=makeBelanjaPeriode(p);b.bulan=S.selMonth;return b;});
  // Ganti semua entry bulan aktif
  const other=(S.i1_belanja||[]).filter(b=>b.bulan&&b.bulan!==S.selMonth);
  S._belanjaSaveAllowed=true;
  setState({i1_belanja:[...other,...newAll]});
  await saveBelanja();
  showAlert('✅ Semua periode direset ke template default dan disimpan','in');
}

// Simpan Belanja ke GAS
async function saveBelanja() {
  if(!S.i1_belanja||!S.i1_belanja.length) return;
  // Hanya kirim belanja untuk bulan aktif
  const belanjaBulanIni=(S.i1_belanja||[]).filter(b=>!b.bulan||b.bulan===S.selMonth);
  if(!belanjaBulanIni.length) return;

  // ================================================================
  // PROTEKSI v3.7: Jangan auto-save jika data belum benar-benar diisi
  // atau jika jumlah pengiriman lebih sedikit dari yang ter-load dari GAS.
  // Cegah data 5-6 pengiriman tertimpa oleh save saat kondisi default (1 pengiriman).
  // ================================================================
  const totalPengiriman = belanjaBulanIni.reduce((sum,b)=>sum+(b.pengiriman_basah||[]).length,0);
  // FIX: deteksi edit nama/jml/sat vs default — bukan hanya sudah/belum/ket
  const hasRealContent = belanjaBulanIni.some(b=>(
    (b.pengiriman_basah||[]).length > 1 ||
    (b.pengiriman_basah||[]).some(pg=>pg.tgl||(pg.items||[]).some(it=>it.sudah||it.belum||it.ket)) ||
    (b.bahan_kering||[]).some(it=>it.sudah||it.belum||it.ket) ||
    b.tgl_kering ||
    (()=>{const def=BELANJA_DATA[b.periode]||BELANJA_DATA[1];return(b.bahan_kering||[]).some((it,i)=>{const d=def.bahan_kering[i];return d&&(it.nama!==d.nama||String(it.jml)!==String(d.jml)||it.sat!==d.sat);});})() ||
    (()=>{const def=BELANJA_DATA[b.periode]||BELANJA_DATA[1];return(b.pengiriman_basah||[]).some((pg,pi)=>(pg.items||[]).some((it,i)=>{const d=(def.pengiriman_basah[pi]||def.pengiriman_basah[0]||{items:[]}).items[i];return d&&(it.nama!==d.nama||String(it.jml)!==String(d.jml)||it.sat!==d.sat);}));})()
  ));
  // Jika data masih default (1 pengiriman, semua kosong) DAN belum pernah di-confirm manual → skip
  if(!hasRealContent && !S._belanjaSaveAllowed){
    console.warn('[saveBelanja] Skip: data masih default, menunggu konfirmasi dari pengguna atau load GAS.');
    return;
  }
  // Proteksi: jika jumlah pengiriman berkurang drastis dari state yang pernah di-load → warn
  if(S._belanjaMaxPengiriman && totalPengiriman < S._belanjaMaxPengiriman && !S._belanjaSaveAllowed){
    console.warn('[saveBelanja] Skip: pengiriman berkurang ('+totalPengiriman+'<'+S._belanjaMaxPengiriman+'). Tunggu interaksi user.');
    return;
  }

  // Pastikan field bulan dan nip user benar di setiap item
  // SHARED: belanja tidak terikat ke nip user – satu data untuk semua operator (seperti bahanStatus)
  const payload=belanjaBulanIni.map(b=>({...b,bulan:S.selMonth,nip:'shared',operator:S.user.name}));
  const res = await gasSavePost('saveBelanja',{belanja:payload, bulan:S.selMonth, nip:'shared', updatedBy:S.user.name});
  if(res.success) showAlert('✅ Daftar belanja tersimpan ke Spreadsheet');
  else showAlert('Gagal simpan belanja: '+(res.error||'error'),'er');
}

// Auto-save belanja setelah perubahan (debounced)

  clearTimeout(belanjaSaveTimer);

}

    #print-overlay-content .bl-fitinner table.bl-tbl td.nw,#print-overlay-content .bl-fitinner table.bl-tbl th.nw{white-space:nowrap !important;overflow-wrap:normal !important;word-break:keep-all !important}

  // ── Halaman BAHAN KERING (tanpa ttd) ─────────────────────────

  const fitBelanjaPages=()=>{
    const probe=document.createElement('div');

    const availH=probe.getBoundingClientRect().height;   // sisa tinggi A4 setelah margin, dengan cadangan ±5 mm
    probe.remove();
    const steps=[['9.5pt','2px 5px'],['9pt','2px 5px'],['8.5pt','1.5px 4px'],['8pt','1.5px 4px'],['7.5pt','1px 3px'],['7pt','1px 3px'],['6.5pt','1px 2px'],['6pt','0.5px 2px']];

  // Re-render just the badge for this item without full re-render
  const rows = document.querySelectorAll('[data-bahan="' + id + '"]');
  rows.forEach(r => {
    const badge = r.closest('tr').querySelector('.bdg');

      badge.className = 'bdg ' + (status === 'ok' ? 'b-ok' : 'b-no');
      badge.textContent = status === 'ok' ? '✓ Tersedia' : '✕ Tidak Ada';
    }

  clearTimeout(_bahanStatusTimer);

    if (!S.user || !GAS_URL) return;

      bulan:  S.selMonth,

      status: S.i1_bahan_status
    });
  }, 1500);
}

// Dynamic extra item row for checklist modals
function addExtraItemRow(containerId, fields) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const idx = container.children.length;

  div.style.cssText = 'display:grid;grid-template-columns:' + fields.map(() => '1fr').join(' ') + ';gap:6px;margin-bottom:6px;align-items:center';

      if (el) obj[f.key] = el.value;
    });
    return obj;
  });

// CORE FIX: extractDriveId - ekstrak Google Drive file ID dari semua format URL
function extractDriveId(url) {
  if (!url || typeof url !== 'string') return '';
  var m1 = url.match(/\/file\/d\/([a-zA-Z0-9_-]{10,})/);
  if (m1) return m1[1];
  var m2 = url.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
  if (m2) return m2[1];
  var m3 = url.match(/lh3\.googleusercontent\.com\/d\/([a-zA-Z0-9_-]{10,})/);
  if (m3) return m3[1];
  var m4 = url.match(/\/d\/([a-zA-Z0-9_-]{10,})/);
  if (m4) return m4[1];
  return '';
}

// Convert Drive URL ke format embeddable (thumbnail)
function driveThumbUrl(url) {
  if (!url) return '';
  // Extract file ID dari berbagai format Drive URL
  let id = '';
  const m1 = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  const m3 = url.match(/lh3\.googleusercontent\.com\/d\/([a-zA-Z0-9_-]+)/);
  const m4 = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m1) id = m1[1];
  else if (m2) id = m2[1];
  else if (m3) id = m3[1];
  else if (m4) id = m4[1];
  // v4.0: gunakan uc?export=view – tidak butuh login browser seperti /thumbnail
  if (id) return 'https://drive.google.com/uc?export=view&id='+id;
  return url;
}



// Kompres gambar sebelum upload ke Drive
async function compressImage(dataUrl, maxPx=1024, quality=0.8) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w=img.width, h=img.height;
      if(w>maxPx||h>maxPx){
        if(w>h){h=Math.round(h*(maxPx/w));w=maxPx;}
        else{w=Math.round(w*(maxPx/h));h=maxPx;}
      }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg',quality));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

// Helper: tampilkan loading state saat delete berlangsung
function delWithLoading(el, gasFn, payload, stateKey, filterId, successMsg) {
  const orig=el.innerHTML;
  el.disabled=true; el.innerHTML='⏳';el.style.opacity='0.6';
  return gasSavePost(gasFn, payload).then(r=>{
    if(r.success){
      S[stateKey]=S[stateKey].filter(x=>String(x.id)!==filterId);
      S.repYear=null;
      if(S.rep&&S.rep[stateKey])S.rep[stateKey]=S.rep[stateKey].filter(x=>String(x.id)!==filterId);
      setState({[stateKey]:S[stateKey]});
      showAlert(successMsg);
    } else {
      el.disabled=false;el.innerHTML=orig;el.style.opacity='';
      showAlert('Gagal hapus: '+(r.error||'error'),'er');
    }
  }).catch(err=>{
    el.disabled=false;el.innerHTML=orig;el.style.opacity='';
    showAlert('Error: '+err.message,'er');
  });
}

async function saveUser(){
  const name=v('f-name'),un=v('f-un'),pw=v('f-pw'),nip=v('f-nip'),nipT=v('f-nipt'),role=v('f-role'),unit=v('f-unit'),jabatan=v('f-jabatan'),email=v('f-email');
  if(!name||!un){showAlert('Nama dan username wajib diisi','er');return}
  const btn=document.getElementById('btn-save-usr');
  if(btn){btn.disabled=true;btn.textContent='⏳ Menyimpan...';}
  try{
    if(S.editItem){
      const upd={...S.editItem,name,un,nip,nipT,role,unit,jabatan,email};
      if(pw) upd.pw=pw;
      const res=await gasSavePost('saveUser',{user:{id:S.editItem.id,name,un,pw:pw||'',nip,nipT,role,unit,jabatan,email}});
      if(res.success){
        setState({users:S.users.map(x=>x.id===S.editItem.id?upd:x),modal:null,editItem:null});
        showAlert('✅ Pengguna berhasil diperbarui');
      }else{showAlert('Gagal: '+(res.error||'error'),'er');}
    }else{
      if(!pw){showAlert('Password wajib diisi untuk pengguna baru','er');return}
      const u={id:Date.now(),name,un,pw,nip,nipT,role,unit,jabatan,email};
      const res=await gasSavePost('saveUser',{user:u});
      if(res.success){
        setState({users:[...S.users,u],modal:null,editItem:null});
        showAlert('✅ Pengguna berhasil ditambahkan');
      }else{showAlert('Gagal: '+(res.error||'error'),'er');}
    }
  }catch(e){showAlert('Error: '+e.message,'er');}
  finally{if(btn){btn.disabled=false;btn.textContent='💾 Simpan Pengguna';}}
}

// ================================================================
// ONLINE/OFFLINE DETECTION
// ================================================================
function updateOnlineStatus() {
  const existing = document.getElementById('offline-banner');
  if (!navigator.onLine) {
    if (!existing) {
      const banner = document.createElement('div');
      banner.id = 'offline-banner';
      banner.className = 'offline-badge no-print';
      banner.innerHTML = '📶 Tidak ada koneksi – data tersimpan lokal';
      document.body.appendChild(banner);
    }
  } else {
    if (existing) existing.remove();
  }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);

// ================================================================
// DETEKSI MODE "SITUS DESKTOP" DI BROWSER HP
// ================================================================
// Catatan teknis: saat browser HP (Chrome/Safari) diset ke mode
// "Situs Desktop", browser mengabaikan <meta name="viewport"> halaman
// dan memaksa lebar layar virtual jadi ~980px+. Ini TIDAK BISA
// diperbaiki lewat kode halaman (di luar kendali JS/CSS), satu-satunya
// solusi adalah user mematikan mode tsb dari menu browser. Yang bisa
// kita lakukan hanya: DETEKSI kondisi ini lalu beri tahu user caranya.
function checkDesktopSiteMode(){
  try{
    const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    const looksLikePhoneUA = /Android|iPhone/i.test(navigator.userAgent);
    if(!isTouchDevice || !looksLikePhoneUA) return; // hanya cek di HP
    const existing = document.getElementById('desktop-mode-banner');
    // Ciri mode "Situs Desktop": lebar viewport jauh lebih besar dari lebar layar fisik
    const forcedWide = window.innerWidth > 650 && window.innerWidth > window.screen.width * 1.2;
    if(forcedWide){
      if(existing) return;
      const banner=document.createElement('div');
      banner.id='desktop-mode-banner';
      banner.className='no-print';
      banner.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#4A0F0F;color:#fff;font-size:12.5px;padding:10px 14px;text-align:center;line-height:1.5';
      banner.innerHTML='⚠️ Tampilan HP Anda sedang dalam mode <b>"Situs Desktop"</b>. Buka menu titik tiga (⋮) di browser, lalu matikan centang <b>"Situs Desktop"</b> agar tampilan kembali normal. <span id="desktop-mode-close" style="text-decoration:underline;cursor:pointer;margin-left:6px">Tutup</span>';
      document.body.prepend(banner);
      const closeBtn=document.getElementById('desktop-mode-close');
      if(closeBtn) closeBtn.onclick=()=>banner.remove();
    } else if(existing){
      existing.remove();
    }
  }catch(e){}
}
window.addEventListener('resize', checkDesktopSiteMode);
window.addEventListener('orientationchange', ()=>setTimeout(checkDesktopSiteMode, 300));

// INIT – menunggu data pengguna dari SIPELAPOR
// ================================================================
function foodInit(m) {
  const u = m.user || {};
  CFG = m.cfg || {};
  KOP_HTML = buildKop();
  const roleMap = { pengolah: 'operator', kasi: 'kasi', admin: 'admin' };
  const role = roleMap[u.role];
  if (!role) { document.getElementById('app').innerHTML = '<div style="padding:30px;text-align:center;color:#8B1A1A">Peran Anda tidak memiliki akses ke modul Dapur.</div>'; return; }
  S.user = { id: u.nip + '|' + u.role, un: u.username || u.nip, name: u.nama, nip: u.nip, nipT: 'NIP', role: role, jabatan: u.jabatan || (role === 'operator' ? 'Pengolah Makanan' : ''), unit: u.unitDapur || 'Semua' };
  S._loginTime = Date.now();
  S.page = m.page || 'dashboard';
  if (m.month) S.selMonth = m.month;
  render();
  updateOfflineBadge();
  if (navigator.onLine && getOfflineQueue().length > 0) syncOfflineQueue();
  loadFromGAS(S.selMonth).then(function () {
    ttdMuat([S.user.nip, CFG.kasiNip].concat((S.users || []).map(function (x) { return x.nip; })));
    const me = (S.users || []).filter(function (x) { return x.nip === S.user.nip; })[0];
    if (me) { S.user.nipT = me.nipT || S.user.nipT; if (me.jabatan) S.user.jabatan = me.jabatan; if (me.unit) S.user.unit = me.unit; render(); }
  });
}
(function boot() {
  render();
  checkDesktopSiteMode();
  try { window.parent.postMessage({ sip: 'food-ready' }, _PARENT_ORIGIN); } catch (e) {}
})();
